name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Gradle (no wrapper)
        run: |
          set -e
          GRADLE_URL=$(grep -E '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\r' || true)
          [ -z "$GRADLE_URL" ] && GRADLE_URL="https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          GRADLE_URL="${GRADLE_URL//\\:/:}"
          curl -L "$GRADLE_URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "$(find /opt -maxdepth 1 -type d -name 'gradle-*' | head -n 1)/bin" >> $GITHUB_PATH

      - name: Build Debug + Release
        run: gradle clean :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload Release (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Debug
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
