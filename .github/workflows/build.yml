name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle from gradle-wrapper.properties (no gradlew needed)
        shell: bash
        run: |
          set -e
          GRADLE_URL=""
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_URL=$(grep -E '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\r')
          fi
          if [ -z "$GRADLE_URL" ]; then
            GRADLE_URL="https\://services.gradle.org/distributions/gradle-7.6-bin.zip"
          fi
          GRADLE_URL="${GRADLE_URL//\\:/:}"
          echo "GRADLE_URL=$GRADLE_URL"
          curl -L "$GRADLE_URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          GRADLE_DIR=$(find /opt -maxdepth 1 -type d -name "gradle-*" | head -n 1)
          echo "$GRADLE_DIR/bin" >> $GITHUB_PATH
          gradle -v

      - name: Build (all variants)
        run: gradle clean assemble --no-daemon

      - name: List outputs
        shell: bash
        run: |
          echo "=== outputs dirs ==="
          find . -maxdepth 6 -type d -path "*build/outputs*" -print || true
          echo "=== APK/AAB files ==="
          find . -maxdepth 10 -type f \( -name "*.apk" -o -name "*.aab" \) -print || true
          echo "=== APK folders ==="
          ls -la app/build/outputs/apk || true
          ls -la app/build/outputs/apk/debug || true
          ls -la app/build/outputs/apk/release || true
          echo "=== Bundle folders ==="
          ls -la app/build/outputs/bundle || true
          ls -la app/build/outputs/bundle/release || true

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
